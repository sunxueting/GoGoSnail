name: Build and game checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:ranking
      - run: npm run test:ranking-ui
      - run: npm test
      - run: npm run test:profile
      - run: npm run test:layout
      - run: npm run test:release
      - run: npm run test:performance
